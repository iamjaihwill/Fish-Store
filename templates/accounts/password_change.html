{% extends "base.html" %}
{% block title %}Change password — {{ site.store_name }}{% endblock %}
{% block content %}
<div class="wrap" style="max-width:520px">
  <header class="page-header"><h1>Change password</h1></header>
  <form method="post" class="panel" style="margin-bottom:4rem">
    {% csrf_token %}
    {% for field in form %}
    <div class="field" style="margin-bottom:1rem">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
    {% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
